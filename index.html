<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سماء منه — ١١/١١</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#06031a;--vio:#2a1263;--rose:#ff8fb1;--gold:#ffd98a;--ink:#fff1e6;--soft:#bfa9dc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Amiri","Noto Naskh Arabic",serif;font-size:21px;line-height:1.85;text-align:center;overflow-x:hidden;
background:radial-gradient(60% 40% at 85% 8%,rgba(120,70,230,.45),transparent 70%),radial-gradient(70% 45% at 10% 95%,rgba(255,110,160,.28),transparent 70%),radial-gradient(90% 60% at 50% 55%,#150a38,var(--bg) 80%) fixed}
#bg{position:fixed;inset:0;pointer-events:none}
#bg i{position:absolute;border-radius:50%;background:#fff;animation:tw 4s infinite}
@keyframes tw{50%{opacity:.1}}
main{position:relative;max-width:480px;margin:0 auto;padding:28px 16px 70px}
.date{font-family:"Reem Kufi","Tahoma",sans-serif;color:var(--gold);font-size:18px;letter-spacing:.06em}
h1{font-family:"Aref Ruqaa","Amiri",serif;font-weight:700;font-size:clamp(44px,14vw,64px);line-height:1.3;margin:0;color:var(--ink);text-shadow:0 0 28px rgba(255,143,177,.45)}
.lead{color:var(--soft);margin:0 auto;max-width:19em;font-size:19px;line-height:1.7}
svg{display:block;width:100%;height:auto;margin:10px auto 0;overflow:visible}
#gd{fill:none;stroke:var(--gold);stroke-width:1.4;stroke-dasharray:1 8;stroke-linecap:round;opacity:.3}
.ln{stroke:var(--gold);stroke-width:1.8;stroke-linecap:round;filter:drop-shadow(0 0 4px var(--gold));transition:stroke-dashoffset 1s ease}
.gl{opacity:0;transition:opacity .8s}
.sp{fill:#7a68b3;transform-box:fill-box;transform-origin:center;transition:fill .5s}
.hit{fill:transparent;pointer-events:none}
.on .sp{fill:var(--gold);filter:drop-shadow(0 0 7px var(--gold))}
.on .gl{opacity:.8}
.next .sp{fill:#fff;animation:pl 1.4s infinite}
.next .gl{opacity:.9;animation:pl 1.4s infinite}
.next .gl,.next .sp{transform-box:fill-box;transform-origin:center}
.next .hit{pointer-events:all;cursor:pointer}
@keyframes pl{50%{transform:scale(1.45)}}
.dots{display:flex;justify-content:center;gap:7px;margin:6px 0 14px}
.dots b{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.18);transition:background .5s,box-shadow .5s}
.dots b.on{background:var(--gold);box-shadow:0 0 8px var(--gold)}
#hf{opacity:0;transition:opacity 2.5s}
.done #hf{opacity:.35}
.card{margin:0 auto;max-width:25em;min-height:9.6em;padding:18px 20px 20px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid rgba(255,217,138,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-direction:column;justify-content:center;gap:6px}
.card .no{font-family:"Reem Kufi","Tahoma",sans-serif;color:var(--gold);font-size:17px}
#msg{font-size:25px;line-height:1.75;transition:opacity .4s,transform .4s}
#msg.out{opacity:0;transform:translateY(8px)}
#fin{display:none;margin-top:34px;opacity:0;transform:translateY(16px);transition:opacity 2s,transform 2s}
#fin.show{opacity:1;transform:none}
.nm{font-family:"Aref Ruqaa","Amiri",serif;font-weight:700;font-size:clamp(96px,34vw,150px);line-height:1.15;background:linear-gradient(180deg,var(--gold),var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(255,143,177,.55))}
#fin p{margin:8px auto;max-width:20em;font-size:23px}
.sg{font-family:"Aref Ruqaa","Amiri",serif;color:var(--gold);font-size:34px;margin-top:10px}
.hr{position:fixed;bottom:-30px;color:var(--rose);opacity:0;pointer-events:none;animation:up linear forwards}
@keyframes up{10%{opacity:.8}100%{transform:translateY(-110vh);opacity:0}}
#shoot{position:fixed;top:10%;left:-10%;width:130px;height:2px;background:linear-gradient(90deg,transparent,#fff);opacity:0;pointer-events:none}
.go #shoot{animation:sh 2.2s ease-out}
@keyframes sh{0%{opacity:1;transform:translate(0,0) rotate(25deg)}100%{opacity:0;transform:translate(130vw,60vh) rotate(25deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div><div id="shoot"></div>
<main id="m">
<div class="date">١١ / ١١ / ٢٠٢٦</div>
<h1>سماء منه</h1>
<p class="lead">١١ نجمة مستنيّاكي. دوسي على النجمة اللي بتلمع.</p>
<svg id="sky" viewBox="0 0 360 340" role="img" aria-label="١١ نجمة بترسم قلب">
<defs><radialGradient id="g"><stop offset="0" stop-color="#ffd98a" stop-opacity=".9"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>
<linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8fb1"/><stop offset="1" stop-color="#7a4bd6"/></linearGradient></defs>
<path id="hf" fill="url(#hg)"/><path id="gd"/>
</svg>
<div class="dots" id="dots" aria-hidden="true"></div>
<div class="card"><div class="no" id="no">السبب ١</div><div id="msg">ابدئي من النجمة اللي بتلمع تحت.</div></div>
<section id="fin">
<div class="nm">منه</div>
<p>١١ نجمة، ١١ سبب، وكلهم ليكي يا منوشتي.</p>
<p>كل سنة وانتي حبيبتي. ١١/١١</p>
<div class="sg">عمر</div>
</section>
</main>
<script>
var AR="٠١٢٣٤٥٦٧٨٩";function ar(n){return String(n).replace(/\d/g,function(d){return AR[d]})}
var bg=document.getElementById("bg");for(var i=0;i<90;i++){var s=document.createElement("i"),z=Math.random()<.12?3:2;s.style.cssText="left:"+Math.random()*100+"%;top:"+Math.random()*100+"%;width:"+z+"px;height:"+z+"px;opacity:"+(.3+Math.random()*.5)+";animation-delay:"+Math.random()*4+"s";bg.appendChild(s)}
var N=11,NS="http://www.w3.org/2000/svg",sky=document.getElementById("sky"),m=document.getElementById("m"),dots=document.getElementById("dots");
function P(t){var X=16*Math.pow(Math.sin(t),3),Y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);return[180+10.5*X,150-10.5*Y]}
function mk(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);(p||sky).appendChild(e);return e}
var S=[],L=[0],M=600,d="";
for(var j=0;j<=M;j++){S.push(P(Math.PI+j*2*Math.PI/M));d+=(j?"L":"M")+S[j][0].toFixed(1)+" "+S[j][1].toFixed(1);if(j)L.push(L[j-1]+Math.hypot(S[j][0]-S[j-1][0],S[j][1]-S[j-1][1]))}
document.getElementById("hf").setAttribute("d",d+"Z");document.getElementById("gd").setAttribute("d",d+"Z");
var pts=[],g=[],cur=0;
for(var k=0;k<N;k++){var tg=L[M]*k/N,j2=0;while(L[j2]<tg)j2++;pts.push(S[j2]);dots.appendChild(document.createElement("b"))}
var SP="M0-12C1.5-3.5 3.5-1.5 12 0C3.5 1.5 1.5 3.5 0 12C-1.5 3.5-3.5 1.5-12 0C-3.5-1.5-1.5-3.5 0-12Z";
function line(a,b){var l=Math.hypot(b[0]-a[0],b[1]-a[1]),e=mk("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],"class":"ln"});sky.insertBefore(e,sky.children[2]);e.style.strokeDasharray=l;e.style.strokeDashoffset=l;e.getBoundingClientRect();e.style.strokeDashoffset=0}
for(var k=0;k<N;k++){(function(k){var c=mk("g",{transform:"translate("+pts[k][0]+","+pts[k][1]+")"});mk("circle",{r:28,fill:"url(#g)","class":"gl"},c);mk("path",{d:SP,"class":"sp"},c);mk("circle",{r:21,"class":"hit"},c);c.addEventListener("click",function(){tap(k)});g.push(c)})(k)}
g[0].classList.add("next");
var T=["ضحكتك أكتر حاجة بتهوّن عليا","عمري ما هحب غيرك، ولا حد تاني هيبقى في قلبي معاكي","هفضل أحبك مهما حصل يا منوشتي","إنتي أحلى حاجة حصلتلي في حياتي","أنا بحبك أوي بجد","عمري ما قابلت حد أحسن منك، ولا هقابل","بدعيلك في صلاتي، وهفضل أدعيلك","اهتمي بصلاتك وحجابك، وحسّني علاقتك بربنا مهما حصل","إنتي أحلى بنوته في الدنيا يا قلبي","اهتمي بدراستك يا قلبي وركّزي","مش ناسي الشهر اللي فات… بس مش شايل"];
var msg=document.getElementById("msg"),no=document.getElementById("no");
function tap(k){if(k!==cur)return;
g[k].classList.remove("next");g[k].classList.add("on");dots.children[k].classList.add("on");
if(k>0)line(pts[k-1],pts[k]);
try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}
msg.classList.add("out");setTimeout(function(){no.textContent="السبب "+ar(k+1);msg.textContent=T[k];msg.classList.remove("out")},300);
cur++;
if(cur<N){g[cur].classList.add("next")}else{setTimeout(function(){line(pts[N-1],pts[0]);document.body.classList.add("go");m.classList.add("done");
var f=document.getElementById("fin");f.style.display="block";f.getBoundingClientRect();f.classList.add("show");
for(var h=0;h<16;h++){var e=document.createElement("span");e.className="hr";e.textContent="♥";e.style.cssText="left:"+Math.random()*95+"%;font-size:"+(12+Math.random()*16)+"px;animation-duration:"+(6+Math.random()*5)+"s;animation-delay:"+Math.random()*3+"s";document.body.appendChild(e)}
setTimeout(function(){f.scrollIntoView({behavior:"smooth",block:"center"})},1400)},900)}}
</script>
</body>
</html>
