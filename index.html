<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سماء منه — ١١/١١</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0a0620;--bg2:#241046;--ink:#fff1e6;--soft:#c9b3dc;--rose:#f59ab4;--gold:#ffd98a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg1)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Amiri","Noto Naskh Arabic",serif;font-size:21px;line-height:1.85;text-align:center;background:radial-gradient(120% 80% at 50% 100%,var(--bg2),var(--bg1) 70%) fixed;overflow-x:hidden}
#bg{position:fixed;inset:0;pointer-events:none}
#bg i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5;animation:tw 4s infinite}
@keyframes tw{50%{opacity:.08}}
main{position:relative;max-width:480px;margin:0 auto;padding:30px 18px 60px}
.k{font-family:"Reem Kufi","Tahoma",sans-serif;color:var(--gold);font-size:19px}
h1{font-family:"Reem Kufi","Tahoma",sans-serif;font-weight:700;font-size:clamp(34px,10vw,48px);line-height:1.25;margin:6px 0 8px}
.lead{color:var(--soft);margin:0 auto;max-width:20em;font-size:20px}
svg{display:block;width:100%;height:auto;margin:6px auto 0;overflow:visible}
.ln{stroke:var(--gold);stroke-width:1.6;stroke-linecap:round;opacity:.85;transition:stroke-dashoffset 1s ease}
.halo{fill:var(--gold);opacity:0}
.st{fill:#5b4a86;transition:fill .6s}
.hit{fill:transparent;pointer-events:none}.next .hit{pointer-events:all;cursor:pointer}
.on .st{fill:var(--gold);filter:drop-shadow(0 0 6px var(--gold))}
.on .halo{opacity:.22}
.next .st{fill:#fff;animation:pl 1.3s infinite}
.next .halo{opacity:.3;animation:pl 1.3s infinite}
@keyframes pl{50%{opacity:.35;transform:scale(1.5)}}
.next .st,.next .halo{transform-box:fill-box;transform-origin:center}
#hf{fill:var(--rose);opacity:0;transition:opacity 2.5s}
.done #hf{opacity:.2}
.cnt{font-family:"Reem Kufi","Tahoma",sans-serif;color:var(--soft);font-size:18px;margin-top:2px}
#msg{min-height:6.6em;margin:14px auto 0;max-width:19em;font-size:24px;line-height:1.7;color:var(--ink);transition:opacity .5s}
#fin{opacity:0;transform:translateY(14px);transition:opacity 2s 1.2s,transform 2s 1.2s;margin-top:8px;display:none}
.done #fin{opacity:1;transform:none}
#fin .nm{font-family:"Reem Kufi","Tahoma",sans-serif;font-size:clamp(70px,24vw,110px);line-height:1.1;color:var(--rose);text-shadow:0 0 30px rgba(245,154,180,.5)}
#fin p{margin:10px auto;max-width:21em}
.sg{font-family:"Reem Kufi","Tahoma",sans-serif;color:var(--gold);font-size:26px;margin-top:14px}
#shoot{position:fixed;top:12%;left:-10%;width:120px;height:2px;background:linear-gradient(90deg,transparent,#fff);transform:rotate(25deg);opacity:0;pointer-events:none}
.go #shoot{animation:sh 2.2s ease-out}
@keyframes sh{0%{opacity:1;transform:translate(0,0) rotate(25deg)}100%{opacity:0;transform:translate(130vw,60vh) rotate(25deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important;transition-delay:0s!important}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div id="shoot"></div>
<main id="m">
<div class="k">١١ / ١١ / ٢٠٢٦</div>
<h1>سماء منه</h1>
<p class="lead">النهارده ١١/١١، وفيه ١١ نجمة مستنيّاكي. دوسي على النجمة اللي بتلمع.</p>
<svg id="sky" viewBox="0 0 360 340" role="img" aria-label="١١ نجمة بترسم قلب"><path id="hf"/></svg>
<div class="cnt" id="cnt">٠ / ١١</div>
<div id="msg" aria-live="polite"></div>
<section id="fin">
<div class="nm">منه</div>
<p>١١ نجمة، ١١ سبب، وكلهم ليكي يا منوشتي.</p>
<p>كل سنة وانتي حبيبتي. ١١/١١</p>
<div class="sg">عمر</div>
</section>
</main>
<script>
var AR="٠١٢٣٤٥٦٧٨٩";function ar(n){return String(n).replace(/\d/g,function(d){return AR[d]})}
var bg=document.getElementById("bg");for(var i=0;i<70;i++){var s=document.createElement("i");s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";s.style.animationDelay=Math.random()*4+"s";bg.appendChild(s)}
var N=11,NS="http://www.w3.org/2000/svg",sky=document.getElementById("sky"),m=document.getElementById("m");
function P(t){var X=16*Math.pow(Math.sin(t),3),Y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);return[180+10.5*X,150-10.5*Y]}
var d="";for(var j=0;j<=120;j++){var q=P(Math.PI+j*2*Math.PI/120);d+=(j?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)}
document.getElementById("hf").setAttribute("d",d+"Z");
var T=["ضحكتك أكتر حاجة بتهوّن عليا", "عمري ما هحب غيرك، ولا حد تاني هيبقى في قلبي معاكي", "هفضل أحبك مهما حصل يا منوشتي", "إنتي أحلى حاجة حصلتلي في حياتي", "أنا بحبك أوي بجد", "عمري ما قابلت حد أحسن منك، ولا هقابل", "بدعيلك في صلاتي، وهفضل أدعيلك", "اهتمي بصلاتك وحجابك، وحسّني علاقتك بربنا مهما حصل", "إنتي أحلى بنوته في الدنيا يا قلبي", "اهتمي بدراستك يا قلبي وركّزي", "مش ناسي الشهر اللي فات… بس مش شايل"];
var pts=[],g=[],cur=0;
function mk(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);return e}
var S=[],L=[0],M=600;for(var j=0;j<=M;j++){S.push(P(Math.PI+j*2*Math.PI/M));if(j)L.push(L[j-1]+Math.hypot(S[j][0]-S[j-1][0],S[j][1]-S[j-1][1]))}
for(var k=0;k<N;k++){var tg=L[M]*k/N,j2=0;while(L[j2]<tg)j2++;pts.push(S[j2])}
function line(a,b){var L=Math.hypot(b[0]-a[0],b[1]-a[1]),l=mk("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],"class":"ln"});l.style.strokeDasharray=L;l.style.strokeDashoffset=L;sky.insertBefore(l,sky.children[1]);l.getBoundingClientRect();l.style.strokeDashoffset=0}
for(var k=0;k<N;k++){(function(k){var c=mk("g",{});c.appendChild(mk("circle",{cx:pts[k][0],cy:pts[k][1],r:15,"class":"halo"}));c.appendChild(mk("circle",{cx:pts[k][0],cy:pts[k][1],r:6,"class":"st"}));c.appendChild(mk("circle",{cx:pts[k][0],cy:pts[k][1],r:20,"class":"hit"}));c.addEventListener("click",function(){tap(k)});sky.appendChild(c);g.push(c)})(k)}
g[0].classList.add("next");
var msg=document.getElementById("msg"),cnt=document.getElementById("cnt");
function tap(k){if(k!==cur)return;
g[k].classList.remove("next");g[k].classList.add("on");
if(k>0)line(pts[k-1],pts[k]);
try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}
msg.style.opacity=0;setTimeout(function(){msg.textContent=T[k];msg.style.opacity=1},250);
cur++;cnt.textContent=ar(cur)+" / "+ar(N);
if(cur<N){g[cur].classList.add("next")}else{setTimeout(function(){line(pts[N-1],pts[0]);var f=document.getElementById("fin");f.style.display="block";f.getBoundingClientRect();document.body.classList.add("go");m.classList.add("done");setTimeout(function(){document.getElementById("fin").scrollIntoView({behavior:"smooth",block:"center"})},1500)},900)}}
</script>
</body>
</html>
